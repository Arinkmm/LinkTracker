server:
  port: 8080

spring:
  application:
    name: bot
  grpc:
    server:
      port: 9091
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
    consumer:
      group-id: ${app.kafka.group-id}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
        specific.avro.reader: true

app:
  client:
    timeout:
      connect-timeout: 3s
      read-timeout: 5s

  rate-limit:
    capacity: 20
    refill-period: 1m
    max-entries: 10000
  updates:
    type: kafka
  scrapper-client:
    type: grpc
  kafka:
    topic: link-updates
    group-id: bot-group
    dlt-topic: link-updates-dlt
    max-retries: 3
    backoff-ms: 1000
    max-dedup-cache-size: 10000
    dedup-ttl: 1h
  scrapper:
    url: ${APP_SCRAPPER_URL:http://localhost:8081}
  grpc:
    host: ${APP_GRPC_HOST:localhost}
    port: 9090
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN}
    update-listener-sleep: 1s
    debug: false

resilience4j:
  retry:
    retry-aspect-order: 1
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: false
        exponential-backoff-multiplier: 2.0
        retryable-status-codes:
          - 500
          - 502
          - 503
          - 504
        retry-exceptions:
          - backend.academy.linktracker.bot.exception.RetryableApiException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.io.UncheckedIOException
    instances:
      scrapper-client:
        base-config: default
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 1s
    instances:
      scrapper-client:
        base-config: default

bot:
  messages:
    welcome: "Добро пожаловать! Используйте /help, чтобы посмотреть доступные команды"
    help-header: "Доступные команды:"
    unknown-command: "Неизвестная команда. Воспользуйтесь /help, чтобы посмотреть список доступных команд"
    tracking: "Пришли ссылку для отслеживания. Если ты передумал пришли /cancel"
    untracking: "Пришли ссылку для прекращения отслеживания. Если ты передумал пришли /cancel"
    list: "Отслеживаемые ссылки:"
    canceling: "Действие отменено"

    tags-offer: "Хочешь добавить теги? (да/нет)"
    invalid-url: "Неверный формат ссылки (GitHub/StackOverflow)"
    tags-prompt: "Теги через запятую (/cancel для отмены)"
    invalid-tags-answer: "Ответь да/нет"
    links: "Ваши ссылки: "
    link-added: "Ссылка добавлена"
    link-added-with-tags: "Ссылка добавлена с тегами"
    link-deleted: "Ссылка удалена из отслеживания"
    link-not-found: "Ссылка не найдена в отслеживании"
    link-is-empty: "Ссылок не обнаружено"
    state-error: "Ошибка состояния. /track заново"
    invalid-response: "Ошибка при обращении к сервису Scrapper"
  commands:
    start:
      name: "/start"
      description: "Начать работу"
    help:
      name: "/help"
      description: "Вывести список доступных команд"
    track:
      name: "/track"
      description: "Начать отслеживание ссылки"
    untrack:
      name: "/untrack"
      description: "Прекратить отслеживание ссылки"
    list:
      name: "/list"
      description: "Вывести список отслеживаемых ссылок (опционально по тегу)"
    cancel:
      name: "/cancel"
      description: "Отменить действие"
  responses:
    needed-tags: "да"
    not-needed-tags: "нет"

sender:
  message-limit: 4096
  continuer: "Продолжение ниже..."
  delimiter: "─────────────────"
