image: "${GITLAB_DOCKER_PROXY}/eclipse-temurin:25-jdk-alpine"

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.artifact.threads=8"
  MAVEN_CLI_OPTS: "--no-transfer-progress --batch-mode"
  GITLAB_DOCKER_PROXY: "gitlab.education.tbank.ru:443/backend-academy-java-2025/lecture-materials/dependency_proxy/containers"
  GIT_DEPTH: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_REF_PROTECTED == 'true'
    - if: $CI_COMMIT_BRANCH == 'master'

stages:
  - build
  - lint
  - test

.cache_base: &cache_base
  key:
    files:
      - pom.xml
      - "**/pom.xml"
    prefix: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - .mvn/wrapper/

build:
  stage: build
  before_script:
    - apk add --no-cache libc6-compat
  script:
    - ./mvnw $MAVEN_CLI_OPTS package -DskipTests=true -Djacoco.skip=true
  cache:
    <<: *cache_base
    policy: pull-push

lint:
  stage: lint
  needs:
    - build
  before_script:
    - apk add --no-cache libc6-compat
  script:
    - ./mvnw $MAVEN_CLI_OPTS compile -am -o spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check
  cache:
    <<: *cache_base
    policy: pull

test:
  stage: test
  needs:
    - build
  services:
    - name: docker:29.0.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "${GITLAB_DOCKER_PROXY}/"
  tags:
    - dind
  before_script:
    - apk add --no-cache docker-cli libc6-compat
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean package -DskipTests=true
    - ./mvnw $MAVEN_CLI_OPTS verify -o
  cache:
    <<: *cache_base
    policy: pull
