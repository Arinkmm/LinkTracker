image: "${GITLAB_DOCKER_PROXY}/eclipse-temurin:25-jdk"

variables:
  MAVEN_ARGS: "-s ${CI_PROJECT_DIR}/.mvn/settings.xml -P ci"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  GITLAB_DOCKER_PROXY: "gitlab.education.tbank.ru:443/backend-academy-java-2025/lecture-materials/dependency_proxy/containers"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_REF_PROTECTED == 'true'
    - if: $CI_COMMIT_BRANCH == 'master'

stages:
  - build
  - lint
  - test

cache:
  key:
    prefix: maven
    files:
      - pom.xml
      - .mvn/settings.xml
  paths:
    - .m2/repository/
  policy: pull

build:
  stage: build
  cache:
    key:
      prefix: maven
      files:
        - pom.xml
        - .mvn/settings.xml
    paths:
      - .m2/repository/
    policy: pull-push
  script:
    - ./mvnw ${MAVEN_ARGS} -T 1C package -DskipTests=true -Djacoco.skip=true
  artifacts:
    expire_in: 1 day
    paths:
      - ai-agent/target/classes/
      - api-common/target/classes/
      - api-common/target/generated-sources/
      - bot/target/classes/
      - scrapper/target/classes/

lint:
  stage: lint
  needs:
    - job: build
      artifacts: true
  script:
    - ./mvnw ${MAVEN_ARGS} -T 1C compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  services:
    - name: docker:29.0.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "${GITLAB_DOCKER_PROXY}/"
  tags:
    - dind
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends docker.io && rm -rf /var/lib/apt/lists/*
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin
  script:
    - ./mvnw ${MAVEN_ARGS} -T 1C verify
