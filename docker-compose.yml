version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: pg_scrapper
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --url=jdbc:postgresql://postgres:5432/${DB_NAME}
      - --username=${DB_USER}
      - --password=${DB_PASSWORD}
      - update
    volumes:
      - ./scrapper/src/main/resources/migrations:/changesets
    networks:
      - backend

  kafka-1:
    image: confluentinc/cp-kafka:8.2.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "19092:19092"
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck: &kafka-health
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - kafka-net

  kafka-2:
    image: confluentinc/cp-kafka:8.2.0
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    healthcheck: *kafka-health
    networks:
      - kafka-net

  kafka-3:
    image: confluentinc/cp-kafka:8.2.0
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    healthcheck: *kafka-health
    networks:
      - kafka-net

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
    healthcheck:
      test: [ "CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/8081 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  kafka-init:
    image: confluentinc/cp-kafka:8.2.0
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic link-updates --partitions 3 --replication-factor 3 &&
       kafka-topics --bootstrap-server kafka-1:9092 --create --if-not-exists --topic link-updates-dlt --partitions 3 --replication-factor 3"
    networks:
      - kafka-net

  valkey-1: &valkey-template
    image: valkey/valkey:8.0
    container_name: valkey-1
    command: ["valkey-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--notify-keyspace-events", "AKE"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - valkey-net
    volumes:
      - valkey-1-data:/data

  valkey-2:
    <<: *valkey-template
    container_name: valkey-2
    ports:
      - "6380:6379"
    volumes:
      - valkey-2-data:/data

  valkey-3:
    <<: *valkey-template
    container_name: valkey-3
    ports:
      - "6381:6379"
    volumes:
      - valkey-3-data:/data

  valkey-init:
    image: valkey/valkey:8.0
    container_name: valkey-init
    depends_on:
      valkey-1:
        condition: service_healthy
      valkey-2:
        condition: service_healthy
      valkey-3:
        condition: service_healthy
    networks:
      - valkey-net
    command: >
      sh -c "
        echo 'yes' | valkey-cli --cluster create valkey-1:6379 valkey-2:6379 valkey-3:6379 --cluster-replicas 0 &&
        until valkey-cli -h valkey-1 cluster info | grep -q 'cluster_state:ok'; do
          echo 'Waiting for cluster to stabilize...';
          sleep 2;
        done;
        echo 'Cluster is ready!'
      "

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    container_name: scrapper
    depends_on:
      postgres:
        condition: service_healthy
      liquibase-migrations:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      valkey-init:
        condition: service_completed_successfully
    environment:
      DB_DRIVER: ${DB_DRIVER}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BOT_URL: http://bot:8080
      APP_GRPC_HOST: bot
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      STACKOVERFLOW_ACCESS_KEY: ${STACKOVERFLOW_ACCESS_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      REDIS_CLUSTER_NODES: valkey-1:6379,valkey-2:6379,valkey-3:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8081:8081"
      - "9091:9091"
    networks:
      - backend
      - kafka-net
      - valkey-net

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    depends_on:
      scrapper:
        condition: service_started
      schema-registry:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      APP_SCRAPPER_URL: http://scrapper:8081
      APP_GRPC_HOST: scrapper
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8080:8080"
      - "9090:9090"
    networks:
      - backend
      - kafka-net

networks:
  backend:
    driver: bridge
  kafka-net:
    driver: bridge
  valkey-net:
    driver: bridge

volumes:
  pg_data:
  valkey-1-data:
  valkey-2-data:
  valkey-3-data:
