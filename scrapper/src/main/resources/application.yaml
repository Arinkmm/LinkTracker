server:
  port: 8081

spring:
  application:
    name: scrapper
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  db:
    access-type: orm
  pagination:
    default-page-size: 20
  client:
    type: http
  bot:
    url: ${APP_BOT_URL:http://localhost:8080}
  grpc:
    host: ${APP_GRPC_HOST:localhost}
    port: 9091

  stackoverflow:
    url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    url: https://api.github.com
    token: ${GITHUB_TOKEN}

notifications:
  default:
    title: "Обновление!"
    body: "%s"
errors:
  invalid-response: "Непредвиденная ошибка при обращении к внешнему сервису"

scheduler:
  interval: 60000
