server:
  port: 8081

spring:
  cache:
    redis:
      time-to-live: 10m
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:localhost:6379,localhost:6380,localhost:6381}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 60s
  application:
    name: scrapper
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: true

app:
  cache:
    l1-capacity: 1000
  db:
    access-type: orm
  pagination:
    default-page-size: 20
  threading:
    pool-size: 4
  client:
    type: kafka
  kafka:
    topic: link-updates
    outbox-checking-interval-ms: 60000
    outbox-checking-limit: 20
    max-retries-for-messages-outbox: 5
    ms-interval-for-cleaning-outbox: 86400000
    days-interval-for-cleaning-outbox: 1
    outbox-cleaning-cron: "0 0 2 * * *"
  bot:
    url: ${APP_BOT_URL:http://localhost:8080}
  grpc:
    host: ${APP_GRPC_HOST:localhost}
    port: 9091

  stackoverflow:
    site: stackoverflow
    filter: "!*JK2R6f)iUdB8zQn9e6hYTcT)El5NN*4fKw)Y0vPLkly"
    batch-size: 100
    url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    url: https://api.github.com
    token: ${GITHUB_TOKEN}

notifications:
  divider: "────────────────"
  date-time-format: "yyyy-MM-dd HH:mm 'UTC'"
  labels:
    title: "Название: "
    question: "Вопрос: "
    author: "Автор: "
    time: "Время: "
    description: "Описание: "
    type-issue: "Issue"
    type-pr: "Pull Request"
    type-answer: "Ответ"
    type-comment: "Комментарий"
    empty-content: "—"
  limits:
    github-body: 200
    stackoverflow-answer: 200
    stackoverflow-comment: 200
  error:
    title: "Не удалось обработать ссылку!"
  defaulting:
    title: "Обновление!"

errors:
  invalid-response: "Непредвиденная ошибка при обращении к внешнему сервису"

scheduler:
  interval-ms: 60000
