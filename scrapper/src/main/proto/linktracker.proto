syntax = "proto3";

package linktracker;

option java_package = "backend.academy.linktracker.grpc";
option java_multiple_files = true;


service ScrapperService {
    rpc RegisterChat    (RegisterChatRequest)    returns (EmptyResponse);
    rpc DeleteChat      (DeleteChatRequest)      returns (EmptyResponse);
    rpc AddLink         (AddLinkRequest)         returns (LinkResponse);
    rpc RemoveLink      (RemoveLinkRequest)      returns (LinkResponse);
    rpc GetLinks        (GetLinksRequest)        returns (ListLinksResponse);
}

message RegisterChatRequest {
    int64 id = 1;
}

message DeleteChatRequest {
    int64 id = 1;
}

message AddLinkRequest {
    int64  tg_chat_id = 1;
    string link       = 2;
    repeated string tags    = 3;
    repeated string filters = 4;
}

message RemoveLinkRequest {
    int64  tg_chat_id = 1;
    string link       = 2;
}

message GetLinksRequest {
    int64 tg_chat_id = 1;
}

message LinkResponse {
    int64  id  = 1;
    string url = 2;
    repeated string tags    = 3;
    repeated string filters = 4;
}

message ListLinksResponse {
    repeated LinkResponse links = 1;
    int32 size                  = 2;
}


service BotService {
    rpc SendUpdate (LinkUpdate) returns (EmptyResponse);
}

message LinkUpdate {
    int64  id          = 1;
    string url         = 2;
    string description = 3;
    repeated int64 tg_chat_ids = 4;
}


message EmptyResponse {}


message ApiErrorResponse {
    string description      = 1;
    string code             = 2;
    string exception_name   = 3;
    string exception_message = 4;
    repeated string stacktrace = 5;
}
